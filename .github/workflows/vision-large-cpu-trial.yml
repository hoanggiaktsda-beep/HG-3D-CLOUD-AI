name: HG larger vision CPU experiment - public drawing only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision-large-cpu-trial.yml'
      - 'hgcloud/quantized_vision.py'
      - 'scripts/public_large_vision_trial.py'
      - 'requirements-vision-large-cpu.txt'
      - 'hgcloud/model_dimensions.py'
      - 'tests/test_model_dimensions.py'
permissions:
  contents: read
concurrency:
  group: public-vision-cpu-experiment
  cancel-in-progress: false
jobs:
  public-drawing:
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-vision-large-cpu.txt
      - name: Geometry gate regression tests (not inference evidence)
        run: |
          python -m unittest discover -s tests -p test_local_vision.py -v
          python -m unittest discover -s tests -p test_model_dimensions.py -v
      - name: Actual larger-model inference
        run: python scripts/public_large_vision_trial.py --output "$RUNNER_TEMP/hg-public-large-vision" --model-cache "$RUNNER_TEMP/hg-large-model-cache"
      - name: Upload only public experiment evidence (never model cache)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg-public-large-vision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hg-public-large-vision/
          if-no-files-found: warn
          retention-days: 1
