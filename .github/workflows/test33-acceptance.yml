name: TEST 33 - public overall acceptance evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test33-acceptance.yml'
      - 'scripts/run_acceptance33.py'
      - 'scripts/audit_scene33.py'
permissions:
  contents: read
concurrency:
  group: test33-public-acceptance
  cancel-in-progress: false
jobs:
  core-and-ocr:
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Free CPU tools and local browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy tesseract-ocr poppler-utils
          python -m pip install -r requirements-backend.txt -r requirements-image.txt -r viewer/requirements-test.txt numpy==2.2.6 opencv-python-headless==4.11.0.86
          python -m playwright install --with-deps chromium
          npm ci --prefix viewer --ignore-scripts --no-audit --no-fund
          npm run build --prefix viewer
      - name: Full regressions with real Blender and authenticated loopback UI
        run: |
          mkdir -p outputs .private
          python scripts/run_acceptance33.py --output "$RUNNER_TEMP/test33-core-summary.json"
      - name: Actual public PNG OCR to Blender - supervised ROIs, not AI
        run: python scripts/cloud_worker_sample.py --output "$RUNNER_TEMP/test33-ocr"
      - name: Inspect actual scene settings without rendering
        run: |
          blender -b -t 2 --python-exit-code 1 --python scripts/blender_build.py -- examples/living_room.json "$RUNNER_TEMP/test33-scene"
          blender -b -t 2 --python-exit-code 1 --python scripts/audit_scene33.py -- examples/living_room.json "$RUNNER_TEMP/test33-scene" "$RUNNER_TEMP/test33-scene-inventory.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test33-core-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/test33-core-summary.json
            ${{ runner.temp }}/test33-ocr/
            ${{ runner.temp }}/test33-scene-inventory.json
          retention-days: 1
          if-no-files-found: warn
  live-vision:
    needs: core-and-ocr
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free CPU tools - no API key or paid runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy tesseract-ocr poppler-utils
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-assembly-cpu.txt
      - name: Actual Qwen OCR to Blender on three fixed public drawings
        run: python scripts/public_assembly_trial.py --output "$RUNNER_TEMP/test33-vision" --model-cache "$RUNNER_TEMP/test33-model-cache"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test33-live-vision-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test33-vision/
          retention-days: 1
          if-no-files-found: warn
  viewer-and-live-pages:
    needs: core-and-ocr
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build reviewed public site and install test browser
        run: |
          npm ci --prefix viewer --ignore-scripts --no-audit --no-fund
          npm run build --prefix viewer
          python -m pip install -r viewer/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Responsive PWA privacy download regressions
        run: |
          mkdir -p outputs/test32
          python scripts/serve_pages_preview.py --port 8792 > "$RUNNER_TEMP/test33-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          HG_VIEWER_URL=http://127.0.0.1:8792/HG-3D-CLOUD-AI/ python -m unittest discover -s viewer/tests -v
      - name: Verify deployed HTTPS website - do not redeploy or simulate success
        run: python scripts/verify_pages32.py
