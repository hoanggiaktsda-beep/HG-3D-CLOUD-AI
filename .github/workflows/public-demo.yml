name: Public sample - real Qwen to Blender and website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-demo.yml'
      - 'scripts/package_public_demo.py'
      - 'scripts/install_public_release.py'
      - 'scripts/verify_public_demo.py'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  infer:
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free CPU tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy tesseract-ocr poppler-utils
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-assembly-cpu.txt
      - name: Public boundary and multiview regressions
        run: |
          python -m unittest discover -s tests -p test_public_demo.py -v
          python -m unittest discover -s tests -p test_multiview.py -v
      - name: Real Qwen OCR and Blender - fixed public catalog only
        run: python scripts/public_assembly_trial.py --output "$RUNNER_TEMP/public-ai" --model-cache "$RUNNER_TEMP/model-cache"
      - name: Package only evidence-validated public results
        run: python scripts/package_public_demo.py --source "$RUNNER_TEMP/public-ai" --output "$RUNNER_TEMP/public-release" --run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: public-ai-release-${{ github.run_id }}
          path: ${{ runner.temp }}/public-release/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: infer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: public-ai-release-${{ github.run_id }}
          path: ${{ runner.temp }}/public-release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build only reviewed site and fixed public result files
        run: |
          npm ci --prefix viewer --ignore-scripts --no-audit --no-fund
          python scripts/install_public_release.py "$RUNNER_TEMP/public-release" --stage
          python -m pip install -r viewer/requirements-test.txt
          python -m playwright install --with-deps chromium
      - name: Check viewer privacy PWA and actual AI result before publication
        run: |
          mkdir -p outputs/test32
          python scripts/serve_pages_preview.py --port 8792 > "$RUNNER_TEMP/preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          HG_VIEWER_URL=http://127.0.0.1:8792/HG-3D-CLOUD-AI/ python -m unittest discover -s viewer/tests -v
          HG_PUBLIC_DEMO_URL=http://127.0.0.1:8792/HG-3D-CLOUD-AI/ python scripts/verify_public_demo.py
      - name: Save only verified public release in this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified public AI demo results'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r viewer/requirements-test.txt && python -m playwright install --with-deps chromium
      - name: Verify real public AI results and downloads on HTTPS Pages
        run: python scripts/verify_public_demo.py
