name: TEST 30 - evidence-gated assembly review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test30-assembly-review.yml'
      - 'hgcloud/assembly_constraints.py'
      - 'scripts/blender_assembly_review.py'
      - 'scripts/capture_assembly_viewport.py'
      - 'scripts/test30_public_trial.py'
      - 'tests/test_assembly_constraints.py'
      - 'requirements-test30.txt'
permissions:
  contents: read
concurrency:
  group: public-test30-assembly
  cancel-in-progress: false
jobs:
  public-images-and-real-blender:
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free tools only, no model or paid API
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender python3-numpy tesseract-ocr poppler-utils xvfb xauth imagemagick
          python -m pip install -r requirements-test30.txt
      - name: Assembly constraints and actual Blender regression fixtures
        run: python -m unittest discover -s tests -p test_assembly_constraints.py -v
      - name: Fixed public drawings, actual Blender and GUI screenshots, never render
        run: xvfb-run -a -s '-screen 0 1440x1000x24 -nolisten tcp' python scripts/test30_public_trial.py --output "$RUNNER_TEMP/hg-test30-public" --capture-viewport
      - name: Upload only public test evidence, not customer data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg-test30-public-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hg-test30-public/
          if-no-files-found: warn
          retention-days: 1
