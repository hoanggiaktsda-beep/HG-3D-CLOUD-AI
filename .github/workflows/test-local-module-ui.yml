name: Verify local 3D modules and FBX export
on:
  pull_request:
    paths:
      - "viewer/**"
      - ".github/workflows/test-local-module-ui.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - run: python -m pip install -r requirements-test.txt
        working-directory: viewer
      - run: python -m playwright install --with-deps chromium
        working-directory: viewer
      - name: Check browser module pipeline and all viewer regressions
        run: |
          mkdir -p outputs
          python scripts/serve_pages_preview.py --port 8792 > outputs/module-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          HG_VIEWER_URL=http://127.0.0.1:8792/HG-3D-CLOUD-AI/ python -m unittest discover -s viewer/tests -v
