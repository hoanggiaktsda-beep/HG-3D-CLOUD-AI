# Deploy only the reviewed static sample. Configure Settings > Pages > GitHub Actions first.
name: Deploy HG sample viewer to Pages
on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "scripts/verify_pages32.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# Publish the newest main commit; supersede stale builds rather than queueing outdated Pages releases.
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: viewer
      - run: npm run build
        working-directory: viewer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
        working-directory: viewer
      - run: python -m playwright install --with-deps chromium
        working-directory: viewer
      # Deployment gate: bounded smoke tests only. Full browser/regression tests run
      # in separate workflows so a stalled WebGL browser cannot block publishing.
      - name: Pages release smoke tests (hard timeout 4 minutes)
        timeout-minutes: 5
        working-directory: viewer
        run: |
          mkdir -p ../outputs/test32
          python ../scripts/serve_pages_preview.py --port 8792 > ../outputs/test32/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          timeout --signal=TERM --kill-after=10s 240s python -m unittest -v tests.test_static_build tests.test_workflow tests.test_hoanggia_theme
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts --no-audit --no-fund && npm run build
        working-directory: viewer
      - run: python -m pip install -r requirements-test.txt && python -m playwright install --with-deps chromium
        working-directory: viewer
      - name: Verify live Pages bytes, GLB/BLEND downloads and offline viewer
        run: python scripts/verify_pages32.py
