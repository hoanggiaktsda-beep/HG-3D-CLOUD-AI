name: HG vision CPU experiment - public data only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vision-cpu-trial.yml'
      - 'hgcloud/local_vision.py'
      - 'scripts/public_vision_trial.py'
      - 'requirements-vision-cpu.txt'
      - 'tests/test_local_vision.py'
permissions:
  contents: read
concurrency:
  group: public-vision-cpu-experiment
  cancel-in-progress: false
jobs:
  public-inference:
    if: github.repository == 'hoanggiaktsda-beep/HG-3D-CLOUD-AI' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      DO_NOT_TRACK: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free CPU dependencies (no API or GPU)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
          python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-vision-cpu.txt
      - name: Safety and geometry gate regression tests (not model inference evidence)
        run: python -m unittest discover -s tests -p test_local_vision.py -v
      - name: Real public-image inference on CPU
        run: python scripts/public_vision_trial.py --output "$RUNNER_TEMP/hg-public-vision" --model-cache "$RUNNER_TEMP/hg-model-cache"
      - name: Upload public evidence even when model experiment fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hg-public-vision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hg-public-vision/
          if-no-files-found: warn
          retention-days: 1
